<svg xmlns="http://www.w3.org/2000/svg" width="900" height="374" viewBox="0 0 900 374">
  <rect x="0" y="0" width="900" height="374" fill="#ffffff"/>
  <rect x="2" y="2" width="896" height="370" fill="none" stroke="#d9dbe8" stroke-width="2"/>
  <text x="36" y="61" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">Q8. Which equation correctly calculates the work done by a</text>
  <text x="36" y="98" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">constant force acting in the direction of an object&#x27;s</text>
  <text x="36" y="135" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">displacement?</text>
  <text x="46" y="182" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">A)  W = Fd</text>
  <text x="46" y="224" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">B)  W = mv</text>
  <text x="46" y="266" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">C)  W = ma</text>
  <text x="46" y="308" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">D)  W = Pt</text>
</svg>