<svg xmlns="http://www.w3.org/2000/svg" width="900" height="337" viewBox="0 0 900 337">
  <rect x="0" y="0" width="900" height="337" fill="#ffffff"/>
  <rect x="2" y="2" width="896" height="333" fill="none" stroke="#d9dbe8" stroke-width="2"/>
  <text x="36" y="61" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">Q16. Two objects each carry a positive electric charge and are</text>
  <text x="36" y="98" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">brought close together. What happens between them?</text>
  <text x="46" y="145" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">A)  They attract each other</text>
  <text x="46" y="187" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">B)  They repel each other</text>
  <text x="46" y="229" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">C)  No electric force acts between them</text>
  <text x="46" y="271" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">D)  Their charges cancel out completely</text>
</svg>