<svg xmlns="http://www.w3.org/2000/svg" width="900" height="373" viewBox="0 0 900 373">
  <rect x="0" y="0" width="900" height="373" fill="#ffffff"/>
  <rect x="2" y="2" width="896" height="369" fill="none" stroke="#d9dbe8" stroke-width="2"/>
  <text x="36" y="61" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">Q6. Which of the following best describes Newton&#x27;s First Law of</text>
  <text x="36" y="98" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">Motion?</text>
  <text x="46" y="145" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">A)  Force equals mass multiplied by acceleration</text>
  <text x="46" y="187" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">B)  An object remains at rest or moves at constant velocity unless</text>
  <text x="46" y="223" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">acted on by a net external force</text>
  <text x="46" y="265" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">C)  For every action there is an equal and opposite reaction</text>
  <text x="46" y="307" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">D)  Objects with greater mass exert a greater gravitational force</text>
</svg>