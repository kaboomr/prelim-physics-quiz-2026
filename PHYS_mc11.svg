<svg xmlns="http://www.w3.org/2000/svg" width="900" height="374" viewBox="0 0 900 374">
  <rect x="0" y="0" width="900" height="374" fill="#ffffff"/>
  <rect x="2" y="2" width="896" height="370" fill="none" stroke="#d9dbe8" stroke-width="2"/>
  <text x="36" y="61" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">Q11. A wave travels through a medium at a constant speed. If</text>
  <text x="36" y="98" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">the frequency of the wave source is doubled, what happens to</text>
  <text x="36" y="135" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">the wavelength?</text>
  <text x="46" y="182" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">A)  It doubles</text>
  <text x="46" y="224" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">B)  It halves</text>
  <text x="46" y="266" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">C)  It stays the same</text>
  <text x="46" y="308" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">D)  It quadruples</text>
</svg>