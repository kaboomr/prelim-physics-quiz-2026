<svg xmlns="http://www.w3.org/2000/svg" width="900" height="374" viewBox="0 0 900 374">
  <rect x="0" y="0" width="900" height="374" fill="#ffffff"/>
  <rect x="2" y="2" width="896" height="370" fill="none" stroke="#d9dbe8" stroke-width="2"/>
  <text x="36" y="61" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">Q13. A wave travels from a less dense medium into a denser</text>
  <text x="36" y="98" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">medium, causing it to slow down. What happens to the direction</text>
  <text x="36" y="135" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">of the wave?</text>
  <text x="46" y="182" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">A)  It bends towards the normal</text>
  <text x="46" y="224" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">B)  It bends away from the normal</text>
  <text x="46" y="266" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">C)  It reflects directly back the way it came</text>
  <text x="46" y="308" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">D)  Its direction is unaffected</text>
</svg>