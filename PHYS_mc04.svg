<svg xmlns="http://www.w3.org/2000/svg" width="900" height="411" viewBox="0 0 900 411">
  <rect x="0" y="0" width="900" height="411" fill="#ffffff"/>
  <rect x="2" y="2" width="896" height="407" fill="none" stroke="#d9dbe8" stroke-width="2"/>
  <text x="36" y="61" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">Q4. A projectile is launched at an angle above the horizontal</text>
  <text x="36" y="98" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">and undergoes projectile motion (ignore air resistance). Which</text>
  <text x="36" y="135" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">component of its velocity remains constant throughout the</text>
  <text x="36" y="172" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">flight?</text>
  <text x="46" y="219" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">A)  The vertical component</text>
  <text x="46" y="261" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">B)  The horizontal component</text>
  <text x="46" y="303" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">C)  Both components</text>
  <text x="46" y="345" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">D)  Neither component</text>
</svg>