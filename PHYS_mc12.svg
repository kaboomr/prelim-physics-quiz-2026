<svg xmlns="http://www.w3.org/2000/svg" width="900" height="337" viewBox="0 0 900 337">
  <rect x="0" y="0" width="900" height="337" fill="#ffffff"/>
  <rect x="2" y="2" width="896" height="333" fill="none" stroke="#d9dbe8" stroke-width="2"/>
  <text x="36" y="61" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">Q12. In a transverse wave, how does the motion of the particles</text>
  <text x="36" y="98" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">in the medium relate to the direction the wave travels?</text>
  <text x="46" y="145" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">A)  Parallel to the direction of travel</text>
  <text x="46" y="187" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">B)  Perpendicular to the direction of travel</text>
  <text x="46" y="229" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">C)  In a circular path around the direction of travel</text>
  <text x="46" y="271" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#1a1a2e">D)  The particles do not move at all</text>
</svg>